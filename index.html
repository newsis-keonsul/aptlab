<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="뉴시스 건설·부동산 인터랙티브 뉴스 준비 중">
  <title>준비 중 | 뉴시스 건설·부동산</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --ink:#121212; --paper:#f5f4ef; --red:#e60012; --line:rgba(18,18,18,.23); }
    * { box-sizing:border-box; }
    body { min-height:100vh; margin:0; overflow:hidden; color:var(--ink); background:var(--paper); font-family:"Noto Sans KR",sans-serif; }
    main { min-height:100vh; padding:26px clamp(24px,5vw,78px); display:flex; flex-direction:column; justify-content:space-between; position:relative; }
    main::before { content:""; width:min(56vw,680px); aspect-ratio:1; position:absolute; top:50%; right:-15vw; border:1px solid var(--line); border-radius:50%; transform:translateY(-50%); box-shadow:0 0 0 14vw rgba(230,0,18,.04),0 0 0 28vw rgba(230,0,18,.025); }
    header, footer, section { position:relative; z-index:1; }
    header { display:flex; justify-content:space-between; align-items:flex-start; }
    .brand { font-size:25px; line-height:.9; font-weight:800; letter-spacing:-.1em; }.brand i { color:var(--red); font-style:normal; }.brand small { display:block; margin-top:9px; color:#767676; font:10px "DM Mono",monospace; letter-spacing:.12em; }
    .status { padding-top:3px; color:var(--red); font:500 11px "DM Mono",monospace; letter-spacing:.08em; }.status::before { content:""; width:7px; height:7px; margin-right:7px; display:inline-block; border-radius:50%; background:currentColor; }
    section { margin-top:auto; margin-bottom:auto; transform:translateY(-2vh); }.eyebrow { display:flex; align-items:center; gap:9px; color:var(--red); font:500 11px "DM Mono",monospace; letter-spacing:.12em; }.eyebrow::before { content:""; width:25px; height:1px; background:currentColor; }
    h1 { max-width:790px; margin:20px 0 0; font-size:clamp(44px,7.1vw,106px); line-height:1.13; letter-spacing:-.085em; font-weight:800; }.red { color:var(--red); }.desc { max-width:425px; margin:25px 0 0; color:#5d5d5a; font-size:14px; line-height:1.85; letter-spacing:-.035em; }
    footer { padding-top:22px; border-top:1px solid var(--line); display:flex; justify-content:space-between; color:#777; font:10px "DM Mono",monospace; letter-spacing:.04em; }
    @media (max-width:600px) { main { padding:22px; }.status { font-size:9px; } main::before { width:92vw; right:-50vw; } h1 { font-size:49px; }.desc { font-size:13px; } footer span:last-child { display:none; } }
  </style>
</head>
<body>
  <main>
    <header><div class="brand">NEWSI<i>S</i><small>CONSTRUCTION &amp; REAL ESTATE</small></div><span class="status">WORK IN PROGRESS</span></header>
    <section><div class="eyebrow">COMING SOON</div><h1>새로운 도시의 이야기를<br><span class="red">준비하고 있습니다.</span></h1><p class="desc">뉴시스 건설·부동산 인터랙티브 뉴스가 곧 찾아옵니다.<br>공간과 사람, 도시의 변화를 더 깊이 있게 전하겠습니다.</p></section>
    <footer><span>© NEWSIS. ALL RIGHTS RESERVED.</span><span>INTERACTIVE NEWS DESK / SEOUL</span></footer>
  </main>
</body>
</html>
